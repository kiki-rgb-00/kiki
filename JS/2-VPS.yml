proxy-providers:
  Primary-VPS:
    type: http
    url: "在这里粘贴一号机场订阅链接"
    path: ./providers/primary.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  Backup-VPS:
    type: http
    url: "在这里粘贴二号机场订阅链接"
    path: ./providers/backup.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: Primary-VPS
    type: select
    use:
      - Primary-VPS

  - name: Backup-VPS
    type: select
    use:
      - Backup-VPS

rules:
  - MATCH,DIRECT