/**
 * Hako 双机场分组测试
 *
 * 目标：
 * 1. 引用基础 YAML 中定义的两个机场名称
 * 2. 创建两个机场选择组
 * 3. 创建总策略组，引用两个机场组
 */

function main(config) {
  const groups = [
    {
      name: "Primary-VPS",
      type: "select",
      use: ["Primary-VPS"]
    },
    {
      name: "Backup-VPS",
      type: "select",
      use: ["Backup-VPS"]
    },
    {
      name: "PROXY",
      type: "select",
      proxies: [
        "Primary-VPS",
        "Backup-VPS"
      ]
    }
  ];

  config["proxy-groups"] = [
    ...(config["proxy-groups"] || []),
    ...groups.filter(
      group =>
        !(config["proxy-groups"] || []).some(
          existing => existing.name === group.name
        )
    )
  ];

  return config;
}