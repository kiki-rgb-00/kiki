      # =========================
      # iCloud
      #
      # Keep iCloud.yaml because it is
      # part of the Apple/iCloud
      # separation logic.
      # =========================

      - name: Download iCloud Rules
        run: |
          wget -O Rules/iCloud.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/iCloud/iCloud.yaml

      # =========================
      # Filter Apple iCloud Rules
      #
      # This step:
      # 1. Removes iCloud rules from Apple.yaml
      # 2. Filters Apple_Domain.yaml
      # 3. Generates iCloud_Domain.txt
      #
      # iCloud_Domain.txt contains only
      # MRS-compatible domain syntax.
      # =========================

      - name: Filter Apple iCloud Rules
        run: |
          python scripts/filter-icloud.py \
            Rules/iCloud.yaml \
            Rules/Apple.yaml \
            Rules/Apple.yaml \
            .tmp/rules/Apple_Domain.yaml \
            .tmp/rules/Apple_Domain_Filtered.yaml \
            .tmp/rules/iCloud_Domain.txt

