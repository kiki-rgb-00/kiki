name: Update Rules MRS

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Prepare directories
      # =========================

      - name: Prepare directories
        run: |
          mkdir -p MRS
          mkdir -p Rules
          mkdir -p .tmp/rules

      # =========================
      # Download Mihomo
      # =========================

      - name: Download Mihomo
        run: |
          wget -O mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1-v1.19.31.gz
          gzip -d mihomo.gz
          chmod +x mihomo

      # =========================
      # Prepare Python
      # =========================

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        continue-on-error: true

      - name: Install PyYAML
        run: |
          python -m pip install PyYAML==6.0.2

      # =========================
      # Original YAML Rules
      # Keep as repository rule sources
      # =========================

      - name: Download Original YAML Rules
        run: |
          wget -O Rules/ChinaMax.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax.yaml

          wget -O Rules/AdvertisingLite.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdvertisingLite/AdvertisingLite.yaml

          wget -O Rules/Advertising.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.yaml

          wget -O Rules/Privacy.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Privacy/Privacy.yaml

          wget -O Rules/Apple.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.yaml


      # =========================
      # Netflix Domain
      # =========================

      - name: Download Netflix Domain Rules
        run: |
          wget -O .tmp/rules/Netflix.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.yaml

      - name: Prepare Netflix Domain Rules
        run: |
          python scripts/filter_netflix.py \
            .tmp/rules/Netflix.yaml \
            .tmp/rules/Netflix_Domain.txt

      - name: Convert Netflix Domain Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/Netflix_Domain.txt \
            MRS/Netflix_Domain.mrs

      # =========================
      # Netflix IP
      # =========================

      - name: Download Netflix IP Rules
        run: |
          wget -O .tmp/rules/Netflix_IP.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix_IP.yaml

      - name: Prepare Netflix IP Rules
        run: |
          python scripts/filter_netflix_ip.py \
            .tmp/rules/Netflix_IP.yaml \
            .tmp/rules/Netflix_IP_Filtered.yaml

      - name: Convert Netflix IP Rules
        run: |
          ./mihomo convert-ruleset \
            ipcidr yaml \
            .tmp/rules/Netflix_IP_Filtered.yaml \
            MRS/Netflix_IP.mrs

      # =========================
      # TikTok Domain
      # =========================

      - name: Download TikTok Rules
        run: |
          wget -O .tmp/rules/TikTok.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.yaml

      - name: Prepare TikTok Domain Rules
        run: |
          python scripts/filter_tiktok.py \
            .tmp/rules/TikTok.yaml \
            .tmp/rules/TikTok_Domain.txt

      - name: Convert TikTok Domain Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/TikTok_Domain.txt \
            MRS/TikTok_Domain.mrs

      # =========================
      # YouTube Domain
      # =========================

      - name: Download YouTube Rules
        run: |
          wget -O .tmp/rules/YouTube.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml

      - name: Prepare YouTube Domain Rules
        run: |
          python scripts/filter_youtube.py \
            .tmp/rules/YouTube.yaml \
            .tmp/rules/YouTube_Domain.txt

      - name: Convert YouTube Domain Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/YouTube_Domain.txt \
            MRS/YouTube_Domain.mrs

      # =========================
      # Spotify Domain
      # =========================

      - name: Download Spotify Rules
        run: |
          wget -O .tmp/rules/Spotify.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.yaml

      - name: Prepare Spotify Domain Rules
        run: |
          python scripts/filter_spotify.py \
            .tmp/rules/Spotify.yaml \
            .tmp/rules/Spotify_Domain.txt

      - name: Convert Spotify Domain Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/Spotify_Domain.txt \
            MRS/Spotify_Domain.mrs

      # =========================
      # Amazon Domain
      # =========================

      - name: Download Amazon Rules
        run: |
          wget -O .tmp/rules/Amazon.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Amazon/Amazon.yaml

      - name: Prepare Amazon Domain Rules
        run: |
          python scripts/filter_amazon.py \
            .tmp/rules/Amazon.yaml \
            .tmp/rules/Amazon_Domain.txt

      - name: Convert Amazon Domain Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/Amazon_Domain.txt \
            MRS/Amazon_Domain.mrs

      # =========================
      # Google Domain
      # =========================

      - name: Download Google Rules
        run: |
          wget -O .tmp/rules/Google.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml

      - name: Prepare Google Domain Rules
        run: |
          python scripts/filter_google.py \
            .tmp/rules/Google.yaml \
            .tmp/rules/Google_Domain.txt

      - name: Convert Google Domain Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/Google_Domain.txt \
            MRS/Google_Domain.mrs

      # =========================
      # OpenAI Domain
      # =========================

      - name: Download OpenAI Rules
        run: |
          wget -O .tmp/rules/OpenAI.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.yaml

      - name: Prepare OpenAI Domain Rules
        run: |
          python scripts/filter_openai.py \
            .tmp/rules/OpenAI.yaml \
            .tmp/rules/OpenAI_Domain.txt

      - name: Convert OpenAI Domain Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/OpenAI_Domain.txt \
            MRS/OpenAI_Domain.mrs

      # =========================
      # Microsoft
      #
      # Clash classical YAML
      # -> MRS-compatible domain text
      # =========================

      - name: Download Microsoft Rules
        run: |
          wget -O .tmp/rules/Microsoft.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.yaml

      - name: Prepare Microsoft Domain Rules
        run: |
          python scripts/filter-microsoft.py \
            .tmp/rules/Microsoft.yaml \
            .tmp/rules/Microsoft_Domain.txt

      - name: Convert Microsoft Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/Microsoft_Domain.txt \
            MRS/Microsoft.mrs

      # =========================
      # Copilot
      #
      # Clash classical YAML
      # -> Domain text
      # -> IP-CIDR text
      # =========================

      - name: Download Copilot Rules
        run: |
          wget -O .tmp/rules/Copilot.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.yaml

      - name: Prepare Copilot Rules
        run: |
          python scripts/filter-copilot.py \
            .tmp/rules/Copilot.yaml \
            .tmp/rules/Copilot_Domain.txt \
            .tmp/rules/Copilot_IP.txt

      - name: Convert Copilot Domain Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/Copilot_Domain.txt \
            MRS/Copilot_Domain.mrs

      - name: Convert Copilot IP Rules
        run: |
          ./mihomo convert-ruleset \
            ipcidr text \
            .tmp/rules/Copilot_IP.txt \
            MRS/Copilot_IP.mrs

      # =========================
      # Emby
      #
      # Keep Emby.yaml as repository
      # rule source.
      #
      # Clash classical YAML
      # -> MRS-compatible domain text
      # =========================

      - name: Download Emby Rules
        run: |
          wget -O Rules/Emby.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Emby/Emby.yaml

      - name: Prepare Emby Domain Rules
        run: |
          python scripts/filter-emby.py \
            Rules/Emby.yaml \
            .tmp/rules/Emby_Domain.txt

      - name: Convert Emby Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/Emby_Domain.txt \
            MRS/Emby.mrs


      # =========================
      # ChinaMax
      # ChinaMax.yaml is kept as
      # repository rule source.
      #
      # Download upstream TXT files
      # directly for MRS conversion.
      # =========================

      - name: Download ChinaMax Domain
        run: |
          wget -O .tmp/rules/ChinaMax_Domain.txt \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_Domain.txt

      # =========================
      # Remove BrowserLeaks
      #
      # Keep BrowserLeaks excluded
      # from ChinaMax Domain rules.
      # The source TXT contains one
      # domain per line.
      # =========================

      - name: Remove BrowserLeaks from ChinaMax Domain
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".tmp/rules/ChinaMax_Domain.txt")
          targets = {"browserleaks.com"}

          lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          removed = []

          for line in lines:
              stripped = line.strip()

              if not stripped or stripped.startswith("#"):
                  output.append(line)
                  continue

              domain = stripped.lower().rstrip(".")

              if domain.startswith("+."):
                  domain = domain[2:]

              if any(
                  domain == target or domain.endswith("." + target)
                  for target in targets
              ):
                  removed.append(stripped)
                  continue

              output.append(line)

          path.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print("Removed BrowserLeaks rules from ChinaMax:")
          for rule in removed:
              print(f"  REMOVE {rule}")

          print(f"Removed: {len(removed)}")
          PY

      - name: Convert ChinaMax Domain
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/ChinaMax_Domain.txt \
            MRS/ChinaMax_Domain.mrs

      # =========================
      # ChinaMax IP
      # Download upstream TXT directly.
      #
      # Remove standalone ASN 132203
      # if present in the source file.
      # =========================

      - name: Download ChinaMax IP
        run: |
          wget -O .tmp/rules/ChinaMax_IP.txt \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_IP.txt

      - name: Remove ChinaMax IP ASN
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".tmp/rules/ChinaMax_IP.txt")
          lines = path.read_text(encoding="utf-8").splitlines()

          output = []
          removed = []

          for line in lines:
              stripped = line.strip()

              # Preserve blank lines and comments.
              if not stripped or stripped.startswith("#"):
                  output.append(line)
                  continue

              # Remove only a standalone ASN entry.
              if stripped.strip("'\"") == "132203":
                  removed.append(stripped)
                  continue

              output.append(line)

          path.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print("Removed ChinaMax IP ASN entries:")
          for rule in removed:
              print(f"  REMOVE {rule}")

          print(f"Removed: {len(removed)}")
          PY

      - name: Convert ChinaMax IP
        run: |
          ./mihomo convert-ruleset \
            ipcidr text \
            .tmp/rules/ChinaMax_IP.txt \
            MRS/ChinaMax_IP.mrs

      # =========================
      # Privacy
      # Privacy.yaml is kept as
      # repository rule source.
      # =========================

      - name: Download Privacy Domain
        run: |
          wget -O .tmp/rules/Privacy_Domain.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Privacy/Privacy_Domain.yaml

      - name: Convert Privacy Domain
        run: |
          ./mihomo convert-ruleset \
            domain yaml \
            .tmp/rules/Privacy_Domain.yaml \
            MRS/Privacy_Domain.mrs

      # =========================
      # Advertising
      # Advertising.yaml is kept as
      # repository rule source.
      # =========================

      - name: Download Advertising Domain
        run: |
          wget -O .tmp/rules/Advertising_Domain.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising_Domain.yaml

      - name: Convert Advertising Domain
        run: |
          ./mihomo convert-ruleset \
            domain yaml \
            .tmp/rules/Advertising_Domain.yaml \
            MRS/Advertising_Domain.mrs

      # =========================
      # AdvertisingLite
      # AdvertisingLite.yaml is filtered with the same exclusions as
      # the MRS source and served to V3 as the classical provider.
      #
      # IMPORTANT:
      # alicdn.com is a mixed-use Alibaba CDN.
      #
      # Keep only the following 6 domains
      # in AdvertisingLite:
      #
      #   alimama.alicdn.com
      #   aecpm.alicdn.com
      #   afp.alicdn.com
      #   afpmm.alicdn.com
      #   atanx2.alicdn.com
      #   unidesk.alicdn.com
      #
      # All other current alicdn.com rules
      # are removed to reduce the risk of
      # blocking legitimate Alibaba/Alipay
      # resources.
      # =========================

      - name: Download AdvertisingLite Domain
        run: |
          wget -O .tmp/rules/AdvertisingLite_Domain.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdvertisingLite/AdvertisingLite_Domain.yaml

      # Filter both formats: the classical provider must not reintroduce
      # domains excluded from the MRS provider.
      - name: Remove AdvertisingLite Alibaba CDN False Positives
        run: |
          python scripts/filter-alibaba.py \
            .tmp/rules/AdvertisingLite_Domain.yaml \
            Rules/AdvertisingLite.yaml

      - name: Convert AdvertisingLite Domain
        run: |
          ./mihomo convert-ruleset \
            domain yaml \
            .tmp/rules/AdvertisingLite_Domain.yaml \
            MRS/AdvertisingLite_Domain.mrs

      # =========================
      # Apple
      # =========================

      - name: Download Apple Domain
        run: |
          wget -O .tmp/rules/Apple_Domain.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple_Domain.yaml

      # =========================
      # iCloud
      #
      # Keep iCloud.yaml because it is
      # part of the Apple/iCloud
      # separation logic.
      # =========================

      - name: Download iCloud Rules
        run: |
          wget -O Rules/iCloud.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/iCloud/iCloud.yaml

      # =========================
      # Filter Apple iCloud Rules
      #
      # This step:
      # 1. Removes iCloud rules from Apple.yaml
      # 2. Filters Apple_Domain.yaml
      # 3. Generates iCloud_Domain.txt
      #
      # iCloud_Domain.txt contains only
      # MRS-compatible domain syntax.
      # =========================

      - name: Filter Apple iCloud Rules
        run: |
          python scripts/filter-icloud.py \
            Rules/iCloud.yaml \
            Rules/Apple.yaml \
            Rules/Apple.yaml \
            .tmp/rules/Apple_Domain.yaml \
            .tmp/rules/Apple_Domain_Filtered.yaml \
            .tmp/rules/iCloud_Domain.txt

      # =========================
      # Convert Apple Domain
      # =========================

      - name: Convert Apple Domain
        run: |
          ./mihomo convert-ruleset \
            domain yaml \
            .tmp/rules/Apple_Domain_Filtered.yaml \
            MRS/Apple_Domain.mrs

      # =========================
      # Convert iCloud
      #
      # IMPORTANT:
      # Do NOT feed the classical
      # iCloud.yaml directly into
      # "domain yaml".
      #
      # Use the generated pure-domain
      # text file instead.
      # =========================

      - name: Convert iCloud Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/iCloud_Domain.txt \
            MRS/iCloud.mrs

      # =========================
      # Service Rules
      # =========================

      - name: Sync service domains and convert MRS
        continue-on-error: true
        run: |
          python scripts/sync-services.py --mihomo ./mihomo

      # =========================
      # Remove temporary build files
      #
      # Everything under .tmp/rules/
      # is generated only for this build.
      # Final MRS files have already been
      # generated before this step.
      # =========================

      - name: Remove temporary build files
        run: |
          rm -rf .tmp/rules/*

      # =========================
      # Commit
      # =========================

      - name: Commit Rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A MRS Rules

          git diff --cached --quiet || git commit -m "Update rules MRS"

          git push
