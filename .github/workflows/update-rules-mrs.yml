name: Update Rules MRS

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Prepare directories
      # =========================

      - name: Prepare directories
        run: |
          mkdir -p MRS
          mkdir -p Rules
          mkdir -p .tmp/rules

      # =========================
      # Download Mihomo
      # =========================

      - name: Download Mihomo
        run: |
          wget -O mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1-v1.19.31.gz
          gzip -d mihomo.gz
          chmod +x mihomo

      # =========================
      # Prepare Python
      # =========================

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        continue-on-error: true

      - name: Install PyYAML
        run: |
          python -m pip install PyYAML==6.0.2

      # =========================
      # Original YAML Rules
      # Keep as repository rule sources
      # =========================

      - name: Download Original YAML Rules
        run: |
          wget -O Rules/ChinaMax.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax.yaml

          wget -O Rules/AdvertisingLite.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdvertisingLite/AdvertisingLite.yaml

          wget -O Rules/Advertising.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.yaml

          wget -O Rules/Privacy.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Privacy/Privacy.yaml

          wget -O Rules/Apple.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.yaml


      # =========================
      # Netflix Domain
      #
      # Download upstream Netflix.yaml.
      # Keep only:
      # DOMAIN
      # DOMAIN-SUFFIX
      # DOMAIN-KEYWORD
      #
      # IP and other rules are
      # maintained separately.
      # =========================

      - name: Download Netflix Domain Rules
        run: |
          wget -O .tmp/rules/Netflix.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.yaml

      - name: Prepare Netflix Domain Rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          source = Path(".tmp/rules/Netflix.yaml")
          output = Path(".tmp/rules/Netflix_Domain.yaml")

          data = yaml.safe_load(source.read_text(encoding="utf-8"))

          if not isinstance(data, dict) or not isinstance(data.get("payload"), list):
              raise ValueError("Invalid Netflix YAML: missing payload list")

          allowed_types = {
              "DOMAIN",
              "DOMAIN-SUFFIX",
              "DOMAIN-KEYWORD",
          }

          rules = data["payload"]
          filtered = [
              rule for rule in rules
              if isinstance(rule, str)
              and rule.split(",", 1)[0].strip().upper() in allowed_types
          ]

          if not filtered:
              raise ValueError("No Netflix domain rules found")

          output.write_text(
              yaml.safe_dump(
                  {"payload": filtered},
                  allow_unicode=True,
                  sort_keys=False,
              ),
              encoding="utf-8",
          )

          print(f"Original rules: {len(rules)}")
          print(f"Domain rules: {len(filtered)}")
          print(f"Excluded IP/other rules: {len(rules) - len(filtered)}")
          PY

      - name: Convert Netflix Domain Rules
        run: |
          ./mihomo convert-ruleset \
            domain yaml \
            .tmp/rules/Netflix_Domain.yaml \
            MRS/Netflix_Domain.mrs

      # =========================
      # Netflix IP
      #
      # Download upstream Netflix_IP.yaml.
      # Convert IP-CIDR / IP-CIDR6 rules
      # into a separate IP MRS file.
      # =========================

      - name: Download Netflix IP Rules
        run: |
          wget -O .tmp/rules/Netflix_IP.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix_IP.yaml

      - name: Convert Netflix IP Rules
        run: |
          ./mihomo convert-ruleset \
            ipcidr yaml \
            .tmp/rules/Netflix_IP.yaml \
            MRS/Netflix_IP.mrs


