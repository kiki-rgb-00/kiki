          ./mihomo convert-ruleset \
            domain yaml \
            .tmp/rules/Apple_Domain_Filtered.yaml \
            MRS/Apple_Domain.mrs

      # =========================
      # Convert iCloud
      #
      # IMPORTANT:
      # Do NOT feed the classical
      # iCloud.yaml directly into
      # "domain yaml".
      #
      # Use the generated pure-domain
      # text file instead.
      # =========================

      - name: Convert iCloud Rules
        run: |
          ./mihomo convert-ruleset \
            domain text \
            .tmp/rules/iCloud_Domain.txt \
            MRS/iCloud.mrs

      # =========================
      # Service Rules
      # =========================

      - name: Sync service domains and convert MRS
        continue-on-error: true
        run: |
          python scripts/sync-services.py --mihomo ./mihomo

      # =========================
      # Remove temporary build files
      #
      # Everything under .tmp/rules/
      # is generated only for this build.
      # Final MRS files have already been
      # generated before this step.
      # =========================

      - name: Remove temporary build files
        run: |
          rm -rf .tmp/rules/*

      # =========================
      # Commit
      # =========================

      - name: Commit Rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A MRS Rules

          git diff --cached --quiet || git commit -m "Update rules MRS"

          git push
