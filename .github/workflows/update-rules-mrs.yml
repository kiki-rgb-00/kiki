      # build files.
      # =========================

      - name: Download ChinaMax Domain
        run: |
          wget -O .tmp/rules/ChinaMax_Domain.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_Domain.yaml

      # =========================
      # Remove BrowserLeaks
      #
      # BrowserLeaks is intentionally
      # excluded from ChinaMax because
      # direct matching would make its
      # IP test show the direct Chinese
      # exit IP instead of the proxy IP.
      #
      # Do NOT modify Rules/ChinaMax.yaml.
      # Only the temporary build file is
      # filtered before MRS conversion.
      # =========================

      - name: Remove BrowserLeaks from ChinaMax Domain
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".tmp/rules/ChinaMax_Domain.yaml")
          targets = {"browserleaks.com"}

          lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          removed = []

          for line in lines:
              stripped = line.strip()

              if not stripped.startswith("-"):
                  output.append(line)
                  continue

              rule = stripped[1:].strip().strip("'\"")
              parts = [part.strip() for part in rule.split(",")]

              # Traditional Clash rules
              if len(parts) >= 2:
                  rule_type = parts[0].upper()
                  domain = parts[1].lower().rstrip(".")

                  if rule_type in {"DOMAIN", "DOMAIN-SUFFIX"}:
                      if any(
                          domain == target or domain.endswith("." + target)
                          for target in targets
                      ):
                          removed.append(rule)
                          continue

              # Pure domain-list entries, e.g. +.example.com
              domain = rule.lower().rstrip(".")

              if domain.startswith("+."):
                  domain = domain[2:]

              if any(
                  domain == target or domain.endswith("." + target)
                  for target in targets
              ):
                  removed.append(rule)
                  continue

              output.append(line)

          path.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print("Removed BrowserLeaks rules from ChinaMax:")
          for rule in removed:
              print(f"  REMOVE {rule}")

          print(f"Removed: {len(removed)}")
          PY

      - name: Download ChinaMax IP
        run: |
          wget -O .tmp/rules/ChinaMax_IP.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_IP.yaml

      - name: Remove ChinaMax IP ASN
        run: |
          sed -i "/^[[:space:]]*-[[:space:]]*['\"]\?132203['\"]\?[[:space:]]*$/d" .tmp/rules/ChinaMax_IP.yaml

