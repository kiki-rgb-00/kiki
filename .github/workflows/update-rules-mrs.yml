      #
      # IMPORTANT:
      # alicdn.com is a mixed-use Alibaba CDN.
      #
      # Keep only the following 6 domains
      # in AdvertisingLite:
      #
      #   alimama.alicdn.com
      #   aecpm.alicdn.com
      #   afp.alicdn.com
      #   afpmm.alicdn.com
      #   atanx2.alicdn.com
      #   unidesk.alicdn.com
      #
      # All other current alicdn.com rules
      # are removed to reduce the risk of
      # blocking legitimate Alibaba/Alipay
      # resources.
      # =========================

      - name: Download AdvertisingLite Domain
        run: |
          wget -O .tmp/rules/AdvertisingLite_Domain.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdvertisingLite/AdvertisingLite_Domain.yaml

      # Filter both formats: the classical provider must not reintroduce
